<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin - Auditoria Fiscal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-10">
    <h1 class="text-2xl font-bold mb-6 text-blue-400">Painel Administrativo</h1>
    
    <div class="bg-slate-900 p-6 rounded-xl border border-slate-700">
        <input id="mun" type="text" placeholder="Nome do Município" class="text-black p-2 rounded mb-2 w-full">
        <input id="valor" type="number" placeholder="Valor Retido" class="text-black p-2 rounded mb-4 w-full">
        <button onclick="enviarDados()" class="bg-blue-600 px-6 py-2 rounded font-bold w-full">Enviar para Tablet</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3v1I544m13pueIBAe3NVKHnes8Se5fB0",
            authDomain: "auditoria-fiscal-bfbd2.firebaseapp.com",
            projectId: "auditoria-fiscal-bfbd2",
            storageBucket: "auditoria-fiscal-bfbd2.firebasestorage.app",
            messagingSenderId: "699209529811",
            appId: "1:699209529811:web:cd40a6e118139769599726"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, "https://auditoria-fiscal-bfbd2-default-rtdb.firebaseio.com/");
        window.enviarDados = function() {
            const mun = document.getElementById('mun').value;
            const valor = document.getElementById('valor').value;
            
            set(ref(db, 'municipios/' + mun), {
                valor: valor,
                atualizadoEm: new Date().toLocaleTimeString()
            }).then(() => {
                alert("Dados enviados com sucesso!");
            });
        };
    </script>
</body>
</html>
