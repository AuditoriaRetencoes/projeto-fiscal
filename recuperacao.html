<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Recuperación Manual - Auditoria Fiscal</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyC3vI1544m13pueIBAe3NVKhnes8Se5FB0",
        authDomain: "auditoria-fiscal-bfbd2.firebaseapp.com",
        databaseURL: "https://auditoria-fiscal-bfbd2-default-rtdb.firebaseio.com",
        projectId: "auditoria-fiscal-bfbd2",
        storageBucket: "auditoria-fiscal-bfbd2.firebasestorage.app",
        messagingSenderId: "699209529811",
        appId: "1:699209529811:web:cd40a6e118139769599726"
      };
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    </script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #fff; margin: 0; padding: 30px; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { margin: 0; font-size: 24px; }
        .subtitle { color: #9ca3af; margin: 5px 0 0 0; }
        
        .btn-action { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px;}
        .btn-action:hover { background: #1d4ed8; }

        .layout-grid { display: grid; grid-template-columns: 350px 1fr; gap: 25px; }
        .form-card, .charts-card { background: #111827; padding: 20px; border-radius: 10px; border: 1px solid #1f2937; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; background: #030712; border: 1px solid #374151; color: #fff; border-radius: 5px; box-sizing: border-box; }
        
        button.btn-save { background: #059669; color: white; width: 100%; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button.btn-save:hover { background: #047857; }

        .charts-container { display: flex; flex-direction: column; gap: 20px; }
        .canvas-box { position: relative; height: 300px; width: 100%; background: #030712; padding: 15px; border-radius: 8px; border: 1px solid #1f2937; }
        .canvas-box h3 { margin: 0 0 10px 0; font-size: 14px; color: #e5e7eb; }
    </style>
</head>
<body>

    <div class="header-flex">
        <div>
            <h1>Aba Administrativa: Recuperação Manual</h1>
            <p class="subtitle">Adicione e analise os valores recuperados de IRRF e ISSQN por município</p>
        </div>
        <a href="gerencial-painel.html" class="btn-action">← Voltar ao Painel Geral</a>
    </div>

    <div class="layout-grid">
        <!-- Formulário de Lançamento Manual -->
        <div class="form-card">
            <h3>Novo Lançamento de Recuperação</h3>
            <div class="form-group" style="margin-top: 15px;">
                <label>Município / Órgão:</label>
                <input type="text" id="recMunicipio" placeholder="Ex: MUNICÍPIO DE PORTEIRINHA">
            </div>
            <div class="form-group">
                <label>Valor ISSQN Recuperado (R$):</label>
                <input type="text" id="recIssqn" placeholder="0,00">
            </div>
            <div class="form-group">
                <label>Valor IRRF Recuperado (R$):</label>
                <input type="text" id="recIrrf" placeholder="0,00">
            </div>
            <button class="btn-save" onclick="salvarRecuperacao()">Salvar Lançamento no Banco</button>
        </div>

        <!-- Área de Gráficos Analíticos de Recuperação -->
        <div class="charts-card">
            <h3 style="margin-top: 0; margin-bottom: 20px;">Análise Gráfica de Recuperação</h3>
            <div class="charts-container">
                <div class="canvas-box">
                    <h3>Recuperação por Município (ISSQN vs IRRF)</h3>
                    <canvas id="chartRecuperacaoMunicipio"></canvas>
                </div>
                <div class="canvas-box">
                    <h3>Comparativo Geral de Impostos Recuperados</h3>
                    <canvas id="chartComparativoImpostos"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let recCharts = {};

        function limparGraficosRec() {
            Object.values(recCharts).forEach(c => c.destroy());
            recCharts = {};
        }

        function converterParaFloat(val) {
            if (!val) return 0;
            let limpo = val.replace("R$", "").replace(/\./g, "").replace(",", ".").trim();
            let num = parseFloat(limpo);
            return isNaN(num) ? 0 : num;
        }

        async function salvarRecuperacao() {
            let municipio = document.getElementById('recMunicipio').value.trim();
            let issqn = converterParaFloat(document.getElementById('recIssqn').value);
            let irrf = converterParaFloat(document.getElementById('recIrrf').value);

            if (!municipio) {
                alert("Por favor, preencha o nome do município.");
                return;
            }

            const dbRef = firebase.database().ref('recuperacoes_manuais');
            try {
                await dbRef.push({
                    municipio: municipio.toUpperCase(),
                    issqn: issqn,
                    irrf: irrf,
                    dataCriacao: new Date().toISOString()
                });
                alert("Dados de recuperação salvos com sucesso!");
                document.getElementById('recMunicipio').value = '';
                document.getElementById('recIssqn').value = '';
                document.getElementById('recIrrf').value = '';
                carregarDadosRecuperacao();
            } catch (e) {
                console.error("Erro ao salvar:", e);
                alert("Erro ao gravar dados.");
            }
        }

        async function carregarDadosRecuperacao() {
            if (!window.firebase || !firebase.database) return;
            const dbRef = firebase.database().ref('recuperacoes_manuais');

            dbRef.once('value', (snapshot) => {
                const dados = snapshot.val();
                limparGraficosRec();

                if (!dados) return;

                let municipiosMap = {};
                let totalIssqnGeral = 0;
                let totalIrrfGeral = 0;

                Object.values(dados).forEach(item => {
                    let mun = item.municipio;
                    let vIss = item.issqn || 0;
                    let vIrrf = item.irrf || 0;

                    if (!municipiosMap[mun]) {
                        municipiosMap[mun] = { issqn: 0, irrf: 0 };
                    }
                    municipiosMap[mun].issqn += vIss;
                    municipiosMap[mun].irrf += vIrrf;

                    totalIssqnGeral += vIss;
                    totalIrrfGeral += vIrrf;
                });

                let labelsMun = Object.keys(municipiosMap);
                let dadosIssqn = labelsMun.map(m => municipiosMap[m].issqn);
                let dadosIrrf = labelsMun.map(m => municipiosMap[m].irrf);

                Chart.defaults.color = '#9ca3af';
                Chart.defaults.borderColor = '#1f2937';

                // Gráfico 1: Município (Agrupado ISSQN e IRRF)
                recCharts.mun = new Chart(document.getElementById('chartRecuperacaoMunicipio'), {
                    type: 'bar',
                    data: {
                        labels: labelsMun,
                        datasets: [
                            { label: 'ISSQN (R$)', data: dadosIssqn, backgroundColor: '#3b82f6', borderRadius: 4 },
                            { label: 'IRRF (R$)', data: dadosIrrf, backgroundColor: '#10b981', borderRadius: 4 }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { 
                            legend: { position: 'top' }, 
                            datalabels: { 
                                anchor: 'end', align: 'top', color: '#fff', font: { size: 9, weight: 'bold' },
                                formatter: (val) => val > 0 ? 'R$ ' + val.toLocaleString('pt-BR', { maximumFractionDigits: 0 }) : ''
                            } 
                        },
                        scales: { y: { beginAtZero: true, grace: '20%' } }
                    },
                    plugins: [ChartDataLabels]
                });

                // Gráfico 2: Comparativo Geral Impostos Recuperados
                recCharts.geral = new Chart(document.getElementById('chartComparativoImpostos'), {
                    type: 'doughnut',
                    data: {
                        labels: ['ISSQN Recuperado', 'IRRF Recuperado'],
                        datasets: [{
                            data: [totalIssqnGeral, totalIrrfGeral],
                            backgroundColor: ['#3b82f6', '#10b981']
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom' },
                            datalabels: {
                                color: '#fff', font: { weight: 'bold', size: 12 },
                                formatter: (val) => 'R$ ' + val.toLocaleString('pt-BR', { minimumFractionDigits: 2 })
                            }
                        }
                    },
                    plugins: [ChartDataLabels]
                });
            });
        }

        window.onload = carregarDadosRecuperacao;
    </script>
</body>
</html>
